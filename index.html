<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>uigen</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .main {
      display: flex;
      flex: 1;
      gap: 0;
      overflow: hidden;
    }

    /* Left panel: prompt input */
    .sidebar {
      width: 320px;
      min-width: 240px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 12px;
    }

    .sidebar label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
    }

    .sidebar textarea {
      flex: 1;
      resize: none;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      min-height: 120px;
    }

    .sidebar textarea:focus {
      border-color: #555;
    }

    .sidebar button.generate {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .sidebar button.generate:hover {
      background: #333;
    }

    /* Right panel: output */
    .output {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Toggle bar */
    .toggle-bar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }

    .toggle-group {
      display: inline-flex;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      overflow: hidden;
      background: #f5f5f5;
    }

    .toggle-group button {
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #666;
      transition: background 0.15s, color 0.15s;
      outline: none;
      user-select: none;
    }

    .toggle-group button:first-child {
      border-right: 1px solid #d0d0d0;
    }

    .toggle-group button.active {
      background: #fff;
      color: #111;
      font-weight: 600;
    }

    .toggle-group button:hover:not(.active) {
      background: #eaeaea;
    }

    /* Panels */
    .panel {
      flex: 1;
      overflow: auto;
      display: none;
      padding: 24px;
    }

    .panel.visible {
      display: block;
    }

    /* Preview panel */
    #panel-preview {
      background: #fafafa;
    }

    .preview-frame {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      min-height: 200px;
      padding: 24px;
    }

    /* Code panel */
    #panel-code {
      background: #1e1e1e;
    }

    #panel-code pre {
      background: transparent;
      color: #d4d4d4;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #aaa;
      font-size: 14px;
      gap: 8px;
    }

    .empty-state svg {
      opacity: 0.4;
    }
  </style>
</head>
<body>

<header>
  <h1>uigen</h1>
</header>

<div class="main">
  <aside class="sidebar">
    <label for="prompt">Describe a UI component</label>
    <textarea id="prompt" placeholder="e.g. A login form with email and password fields and a submit button"></textarea>
    <button class="generate" id="btn-generate">Generate</button>
  </aside>

  <div class="output">
    <div class="toggle-bar">
      <div class="toggle-group" role="tablist" aria-label="View mode">
        <button
          id="tab-preview"
          role="tab"
          aria-selected="true"
          aria-controls="panel-preview"
          class="active"
        >Preview</button>
        <button
          id="tab-code"
          role="tab"
          aria-selected="false"
          aria-controls="panel-code"
          class=""
        >Code</button>
      </div>
    </div>

    <div id="panel-preview" class="panel visible" role="tabpanel" aria-labelledby="tab-preview">
      <div class="preview-frame" id="preview-content">
        <div class="empty-state">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18"/>
            <path d="M9 21V9"/>
          </svg>
          <span>Your preview will appear here</span>
        </div>
      </div>
    </div>

    <div id="panel-code" class="panel" role="tabpanel" aria-labelledby="tab-code">
      <pre id="code-content"><span style="color:#888">// Generated code will appear here</span></pre>
    </div>
  </div>
</div>

<script>
  // Toggle between Preview and Code tabs
  const tabPreview = document.getElementById('tab-preview');
  const tabCode = document.getElementById('tab-code');
  const panelPreview = document.getElementById('panel-preview');
  const panelCode = document.getElementById('panel-code');

  function switchTab(activeTab) {
    if (activeTab === 'preview') {
      tabPreview.classList.add('active');
      tabPreview.setAttribute('aria-selected', 'true');
      tabCode.classList.remove('active');
      tabCode.setAttribute('aria-selected', 'false');

      panelPreview.classList.add('visible');
      panelCode.classList.remove('visible');
    } else {
      tabCode.classList.add('active');
      tabCode.setAttribute('aria-selected', 'true');
      tabPreview.classList.remove('active');
      tabPreview.setAttribute('aria-selected', 'false');

      panelCode.classList.add('visible');
      panelPreview.classList.remove('visible');
    }
  }

  tabPreview.addEventListener('click', () => switchTab('preview'));
  tabCode.addEventListener('click', () => switchTab('code'));

  // Simple demo generator
  const btnGenerate = document.getElementById('btn-generate');
  const prompt = document.getElementById('prompt');
  const previewContent = document.getElementById('preview-content');
  const codeContent = document.getElementById('code-content');

  btnGenerate.addEventListener('click', () => {
    const text = prompt.value.trim();
    if (!text) return;

    const html = generateComponent(text);
    previewContent.innerHTML = html;
    codeContent.textContent = html;

    // Switch to preview tab after generating
    switchTab('preview');
  });

  function generateComponent(description) {
    const lower = description.toLowerCase();

    if (lower.includes('login') || lower.includes('sign in')) {
      return `<form style="max-width:320px;display:flex;flex-direction:column;gap:14px">
  <h2 style="font-size:20px;font-weight:700">Sign in</h2>
  <div style="display:flex;flex-direction:column;gap:4px">
    <label style="font-size:13px;font-weight:500">Email</label>
    <input type="email" placeholder="you@example.com" style="border:1px solid #ccc;border-radius:6px;padding:8px 10px;font-size:14px;outline:none" />
  </div>
  <div style="display:flex;flex-direction:column;gap:4px">
    <label style="font-size:13px;font-weight:500">Password</label>
    <input type="password" placeholder="••••••••" style="border:1px solid #ccc;border-radius:6px;padding:8px 10px;font-size:14px;outline:none" />
  </div>
  <button type="submit" style="background:#111;color:#fff;border:none;border-radius:6px;padding:10px;font-size:14px;font-weight:600;cursor:pointer">Sign in</button>
</form>`;
    }

    if (lower.includes('button')) {
      return `<div style="display:flex;gap:10px;flex-wrap:wrap">
  <button style="background:#111;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer">Primary</button>
  <button style="background:transparent;color:#111;border:1px solid #ccc;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer">Secondary</button>
  <button style="background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer">Danger</button>
</div>`;
    }

    if (lower.includes('card')) {
      return `<div style="max-width:300px;border:1px solid #e0e0e0;border-radius:10px;overflow:hidden">
  <div style="background:#f0f0f0;height:140px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px">Image</div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:8px">
    <h3 style="font-size:16px;font-weight:700">Card Title</h3>
    <p style="font-size:13px;color:#666;line-height:1.5">A short description of the card content goes here.</p>
    <button style="background:#111;color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;align-self:flex-start">View more</button>
  </div>
</div>`;
    }

    // Generic fallback
    return `<div style="padding:20px;border:1px dashed #ccc;border-radius:8px;font-size:14px;color:#666">
  <p>Generated component for: <strong>${escapeHtml(description)}</strong></p>
</div>`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
